# Port 22 belongs to the Windows OpenSSH server: .wslconfig sets
# networkingMode=mirrored, so this distro shares the host adapters and
# ssh.socket lost the bind race — "Dependency failed for ssh.service" every boot
# since 2026-08-29, which is why ssh desktop-wsl.gg.ez stopped working.
#
# BOTH families spelled out. A bare "ListenStream=2222" bound only [::]:2222
# here and an IPv4 client got "Connection refused", not a timeout — the usual
# v4-mapped fallback does not apply in this namespace.
[Socket]
ListenStream=
ListenStream=0.0.0.0:2222
ListenStream=[::]:2222
