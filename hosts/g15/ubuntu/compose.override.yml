# Host-local, g15 only. The DB image mounts a bind path on the distro ext4
# instead of a named docker volume: the 186 GB PGDATA was copied in physically
# from g16 (rsync/tar straight into this path), which a named volume
# would not have allowed without root inside docker.s storage dir.
# Image pinned by digest to the exact build the copied catalog came from --
# a pgvector minor bump or a different glibc collation would let the DB start
# and then misbehave on text/vector indexes.
services:
  db:
    image: pgvector/pgvector@sha256:212765b63c1462883de295c4c415edcd22191b8d8d46853e86ad05d4b577a4cb
    volumes:
      - /data/qaz-code/pgdata:/var/lib/postgresql
