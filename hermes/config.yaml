model:
  provider: nous
  base_url: https://inference-api.nousresearch.com/v1
  default: deepseek/deepseek-v4-pro
agent:
  max_turns: 150
web:
  backend: firecrawl
  use_gateway: true
browser:
  cloud_provider: browser-use
  use_gateway: true
display:
  tool_progress: false
  show_reasoning: false
  compact: true
  credits_notices: false
  turn_completion_explainer: false
  show_commentary: false
  show_cost: false
  streaming: false
  timestamps: false
tts:
  provider: openai
  use_gateway: true
stt:
  provider: openai
  use_gateway: true
_config_version: 33
plugins:
  enabled:
    - orca-status
image_gen:
  use_gateway: true
video_gen:
  provider: fal
  use_gateway: true
session_reset:
  mode: none
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - terminal
    - todo
    - tts
    - vision
    - web
    - yuanbao
known_plugin_toolsets:
  cli:
    - spotify
