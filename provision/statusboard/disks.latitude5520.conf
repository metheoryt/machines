# provision/statusboard/disks.latitude5520.conf — the disk map for latitude5520.
#
# Read once at startup by provision/statusboard/statusboard.sh, which finds it by OS
# hostname (STATUSBOARD_DISKMAP overrides). Two directives, everything else ignored:
#
#   bay <tag> <label>     rename a physical slot; <label> is clipped at 9 columns
#   transient <mount>     this disk is SUPPOSED to come and go — when it vanishes,
#                         drop its row instead of showing `!! gone !!` and alerting
#
# The <tag> is what the board derives from sysfs topology on its own: `u<bus>-<port>:<lun>`
# for USB, the controller name for NVMe. It is stable in the parts that are physical —
# the port path is where the cable goes, the LUN is which bay of a multi-bay bridge.
# Run this on the box to list what is currently plugged in and where:
#
#   for d in /sys/block/sd* /sys/block/nvme*n1; do
#     n="${d##*/}"; printf '%-8s %s\n' "$n" "$(readlink -f "$d/device")"
#   done
#
# The hardware, as of 2026-09-10. Bus 4 is the xHCI at pci 00:14.0, bus 2 the one at
# 00:0d.0 (the USB-C side), bus 3 the USB 2.0 half of the same 00:14.0 controller.
#
#   dockA / dockB   two IDENTICAL UGREEN CM198 docks — dual-bay 2.5"/3.5" SATA to
#                   USB 3, externally powered. Each is ONE bridge with two LUNs, which
#                   is why dockA0 and dockA1 differ only in the LUN of one tag. LUN 0 is
#                   the FRONT bay and dockA is the dock holding the 320G — both confirmed
#                   by looking at the machine, 2026-08-19, which is the only way to know
#                   it: the tag says which port and which LUN, never which box on the
#                   desk. They are
#                   told apart in the kernel log by bridge serial: 670200210032 has come
#                   up on port 4-1 and 6702002103E1 on 4-2 across every replug so far.
#   ns1066          A STOPGAP, and the only slot here that is not a dock bay. All four
#                   dock bays were full when the 8 TB arrived, so the ST1000LM024 that
#                   used to sit in dockB0 moved into a loose NS1066 bridge. It comes up
#                   on the USB 2.0 HALF of the 00:14.0 controller — 480 Mbit, tag
#                   u3-2.4:0 — because its SuperSpeed pairs do not make contact: the
#                   connector has poor mechanical retention and walks. A USB3 hub
#                   presents TWO logical hubs, a SuperSpeed one on bus 2 and a USB 2.0
#                   one on bus 3, so the same physical port can enumerate at either
#                   tag and a bus change is NOT proof the drive was moved. Watch
#                   UDMA_CRC_Error_Count on that drive (0 as of 2026-09-10): the disk
#                   itself is fine and the cable is what is failing. This slot goes away
#                   when spare320 is emptied and frees dockA0.
#   usbcXS          a USB-C port on the machine, no adapter in between. EMPTY since the
#                   XS2000 left the box in early September; the line is kept because a
#                   slot is a slot whether or not anything is in it.
#   hubSATA         the other USB-C port -> a PD hub -> a SATA-USB3 adapter. The hub is
#                   the 2-1 device and the adapter hangs off its port 4, so the slot is
#                   2-1.4: replug the adapter into another hub port and the tag moves
#                   with it, which is correct — that IS a different slot. NOT PLUGGED IN
#                   as of 2026-08-19; the 320G that used to live there is in dockA0 now,
#                   and the card reader that shared the hub is gone with it.
#
#   tag        node  model                       size   mount
#   u4-1:0     sdc   ST320LT020-9YG142           298G   /mnt/spare320
#   u4-1:1     sdb   HGST HTS541010A9E680        931G   /mnt/immich-2024-backup
#   u4-2:0     sdd   WDC WD80EAAZ-22BXBB0        7.3T   /mnt/wd8
#   u4-2:1     sdf   WDC WD10SPZX-21Z10T0        931G   /mnt/immich-2024
#   u3-2.4:0   sda   ST1000LM024 HN-M101MBB      931G   /mnt/immich-mirror
#   u2-2:0     -     (empty — XS2000 gone)         -    -
#   nvme0      -     KINGSTON SNV2S1000G         931G   /mnt/immich
#   nvme1      -     KBG40ZNS512G KIOXIA         476G   / and /boot/efi
#
# THREE things in that table moved on 2026-09-10 and the whole point of re-measuring is
# that none of them were guessable: the 8 TB took dockB0, the ST1000LM024 it displaced
# went to the loose bridge, and the HGST at dockA1 stopped being /mnt/servarr — its
# media copy was proven redundant against /mnt/wd8 and the drive was repurposed as the
# archive's second copy. The nvme rows were also SWAPPED here until today (the KINGSTON
# is controller nvme0, not nvme1); nvme controller numbering is no more durable than an
# sd letter.
#
# The NODE column is the one thing here that is NOT durable — sd letters are handed out
# lowest-free, so a replug reshuffles them (`sdd` was the ST1000LM024 on 2026-08-16 and
# is the WD 8 TB now). Read it as "what it was when this was written", never as an
# identity; the tag and the model are the identities.

bay u4-1:0    dockA0
bay u4-1:1    dockA1
bay u4-2:0    dockB0
bay u4-2:1    dockB1
bay u2-1.4:0  hubSATA
bay u2-2:0    usbcXS
bay u3-2.4:0  ns1066

# NO `transient` LINE ANY MORE. It read `transient /mnt/xs` — the XS2000 was a portable
# drive that left with the person carrying it, so its mount vanishing was not a failure.
# That drive is out of the fleet and /mnt/xs is commented out of fstab, so the exemption
# now covers nothing. It is deleted rather than kept "in case": an exemption for a mount
# that cannot appear is indistinguishable from an exemption nobody remembers granting,
# and this directive exists to SUPPRESS an alarm. Every mount the board can see today is
# one whose absence is a real fault, including /mnt/immich-mirror — its enclosure is
# unreliable, which is an argument for hearing about it, not for muting it.
